  const SALT = "jam-book", ROUNDS = 600000, MAGIC = "jam-book:";
  const text = new TextEncoder();
  const form = document.getElementById("lock"), status = document.getElementById("status");

  async function unlock(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-CTR", false, ["decrypt"]);
    const data = Uint8Array.from(atob(PAGE), (c) => c.charCodeAt(0));
    const plain = await crypto.subtle.decrypt({ name: "AES-CTR", counter: data.slice(0, 16), length: 64 }, key, data.slice(16));
    const html = new TextDecoder().decode(plain);
    if (!html.startsWith(MAGIC)) return false;
    document.open();
    document.write(html.slice(MAGIC.length));
    document.close();
    return true;
  }

  async function keyOf(password) {
    const base = await crypto.subtle.importKey("raw", text.encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: text.encode(SALT), iterations: ROUNDS }, base, 256);
    return new Uint8Array(bits);
  }

  const saved = () => { try { return localStorage.getItem("jam-book-key"); } catch { return null; } };
  const save = (raw) => { try { localStorage.setItem("jam-book-key", btoa(String.fromCharCode(...raw))); } catch {} };

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "Открываю…";
    const raw = await keyOf(document.getElementById("password").value.trim().toLowerCase());
    if (await unlock(raw)) save(raw);
    else status.textContent = "Пароль не подошёл.";
  });

  (async () => {
    const key = saved();
    if (key && await unlock(Uint8Array.from(atob(key), (c) => c.charCodeAt(0)))) return;
    form.hidden = false;
    document.getElementById("password").focus();
  })();
})();
